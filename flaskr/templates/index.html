<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Resume Tailor</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
</head>
<body>
  <div class="container my-3">
    <div class="container">
      <div class="row">
        <div class="col">
          <div class="mb-3">
            <label for="postTextarea">
              Job Description
            </label>
            <textarea
              class="form-control auto-expand"
              id="postTextarea"
              rows="3"></textarea>
          </div>
          <button
            type="button"
            class="btn btn-primary"
            id="analyzeButton">
            Analyze
          </button>
          <div
            class="my-3"
            id="analyzeOutput">
          </div>
        </div>
        <div class="col">
          <label
            for="jsonInput"
            class="form-label">
            Resume
          </label>
          <div class="input-group mb-3">
            <input
              type="file"
              id="jsonInput"
              class="form-control">
            <button
              class="btn btn-secondary"
              type="button"
              id="uploadButton"
              disabled>
              Upload JSON
            </button>
          </div>
          <div class="mb-3">
            <label for="summaryTextarea">
              Summary
            </label>
            <textarea
              class="form-control auto-expand"
              id="summaryTextarea"
              rows="3"></textarea>
          </div>
          <button
            type="button"
            class="btn btn-primary"
            id="similarityButton">
            Compute Similarity
          </button>
          <div
            class="my-3"
            id="similarityOutput">
          </div>
          <div
            class="mb-3"
            id="uploadOutput">
          </div>
        </div>
      </div>
    </div>
  </div>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous">
  </script>
  <script src="http://SortableJS.github.io/Sortable/Sortable.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script
    type="module"
    src="static/script.js">
  </script>
</body>
</html>
